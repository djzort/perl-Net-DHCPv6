name    = Net-DHCPv6
version = 0.001
author  = Dean Hamstead <dean@fragfest.com.au>
license = MIT
copyright_holder = Dean Hamstead
copyright_year   = 2026
main_module = lib/Net/DHCPv6.pm

[@Filter]
-bundle = @Basic
-remove = Readme
[MetaProvides::Package]
[MetaJSON]
[MetaTests]
[MetaNoIndex]
directory = t
[ModuleBuild]
[GithubMeta]
issues = 1

[CPANFile]
[Test::Perl::Critic]
[Test::Kwalitee]
[Test::Compile]
[Test::EOF]
[FileFinder::ByName / EOLFiles]
skip = ^t/data/
skip = AUTHOR_PLEDGE
skip = ^docs/
[Test::EOL]
finder = EOLFiles
[Test::Portability]
[Test::Legal]
[Test::NoTabs]
finder = EOLFiles
[Test::PAUSE::Permissions]
[Test::UnusedVars]
[Test::NoBreakpoints]
[Test::CleanNamespaces]
skip = ^Net::DHCPv6::Constants$
[PodCoverageTests]
[PodSyntaxTests]
[RunExtraTests]
[CheckChangeLog]
[PkgVersion]
die_on_existing_version = 1
[PodWeaver]
[PerlTidy]

[Covenant]
version = 1
pledge_file = AUTHOR_PLEDGE

[Git::Contributors]
[ContributorsFile]
[Git::CheckFor::CorrectBranch]
[Git::Remote::Check]
[Git::Tag]

[PruneFiles]
match = ^dist\.ini
filename = .editorconfig
filename = .perltidyrc
filename = PLAN.md
filename = weaver.ini

[Clean]

[Prereqs]
Carp                 = 0
Const::Fast::Exporter = 0
Ref::Util            = 0
namespace::clean     = 0
strictures           = 2
perl                 = 5.024

[Prereqs / TestRequires]
File::Slurper = 0
Test2::V1  = 0
Test2::Mock = 0
